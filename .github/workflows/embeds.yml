name: Check pitch videos

# YouTube channels can remove videos or turn off embedding at any time.
# This runs weekly; a failed run (GitHub emails you) means a clip needs replacing.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

jobs:
  embeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_embeds.py
